; KFMon watch: opening lichess-puzzles.png on the Kobo runs the puzzles.
;
; This single file is also what puts "Lichess Puzzles" in the NickelMenu menu,
; because .adds/nm/kfmon carries a "generator : main : kfmon" line that
; publishes every active watch there.
;
; Installs to .adds/kfmon/config/lichess-puzzles.ini on the device.
[watch]
filename = /mnt/onboard/lichess-puzzles.png
action = /mnt/onboard/.adds/lichess-puzzles/launch.sh
label = Lichess Puzzles
hidden = 0
; KOReader takes over the screen, so nothing else may be launched behind it.
block_spawns = 1
; Give the tile a real title in the library instead of the file name.
do_db_update = 1
db_title = Lichess Puzzles
db_author = lichess.org
db_comment = Chess puzzles, solved on the Kobo
